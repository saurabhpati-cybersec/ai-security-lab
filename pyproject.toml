[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-security-lab"
version = "0.1.0"
description = "A hands-on AI security portfolio: prompt injection, RAG poisoning, detection engineering, and more."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ai-security-lab contributors" }]
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
