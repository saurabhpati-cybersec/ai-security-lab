# Cortex XSOAR 8.x Playbook: AI Agent Exfiltration Response
# Parallel to: soar-companion/tines/stories/exfiltration_response.json
id: AIAgentExfiltrationResponse
version: 1
name: AI Agent - Exfiltration Response
description: >
  Responds to AI-002 (unauthorized egress) and AI-010 (data boundary violation)
  alerts. Checks whether the OutputFilter already blocked the event; if not,
  initiates egress blocking, Slack notification, and a P1 Jira ticket. If the
  OutputFilter did block it, opens a lower-priority allowlist review ticket.
starttaskid: "0"
tasks:
  "0":
    id: "0"
    taskid: start
    type: start
    task:
      id: start
      version: 1
      name: Start
      iscommand: false
      brand: ""
    nexttasks:
      "#none#": ["1"]
  "1":
    id: "1"
    taskid: check-signal-type
    type: condition
    task:
      id: check-signal-type
      version: 1
      name: "AI-002 or AI-010 signal?"
      description: >
        Confirms this incident was triggered by an egress-related alert code
        before taking any blocking action.
      type: condition
      iscommand: false
      brand: ""
    conditions:
      - label: "Egress Signal"
        condition:
          - - operator: inList
              left:
                value:
                  simple: ${incident.aisecurityeventtype}
                iscontext: true
              right:
                value:
                  simple: "policy_violation,detector_hit"
      - label: "Egress Signal"
        condition:
          - - operator: containsString
              left:
                value:
                  simple: ${incident.labels}
                iscontext: true
              right:
                value:
                  simple: "AI-002"
    nexttasks:
      "Egress Signal": ["2"]
      "#default#": ["7"]
  "2":
    id: "2"
    taskid: check-output-filter-blocked
    type: condition
    task:
      id: check-output-filter-blocked
      version: 1
      name: "OutputFilter already blocked?"
      description: >
        Checks the aisecurityoutputfilterblocked field. If true, the OutputFilter
        intercepted the egress attempt at runtime; response can be lower priority.
        If false, content may have escaped and requires immediate blocking.
      type: condition
      iscommand: false
      brand: ""
    conditions:
      - label: "Already Blocked"
        condition:
          - - operator: isEqualTo
              left:
                value:
                  simple: ${incident.aisecurityoutputfilterblocked}
                iscontext: true
              right:
                value:
                  simple: "true"
    nexttasks:
      "Already Blocked": ["6"]
      "#default#": ["3"]
  "3":
    id: "3"
    taskid: block-egress
    type: regular
    task:
      id: block-egress
      version: 1
      name: Block Egress - Revoke Agent Key
      description: >
        Egress was NOT blocked by the OutputFilter; content may have escaped.
        Revokes the agent API key immediately to halt any further outbound
        activity. Network-layer egress block should be applied manually per
        runbook.
      iscommand: true
      name: "AIAgentLogIntegration.revokeAgentKey"
      brand: "AI Agent Log Integration"
    scriptarguments:
      agent_id:
        complex:
          root: incident
          accessor: aisecurityagentid
      reason:
        simple: "Exfiltration response: OutputFilter did not block - XSOAR incident ${incident.id}"
    nexttasks:
      "#none#": ["4", "5"]
  "4":
    id: "4"
    taskid: notify-slack-unblocked
    type: regular
    task:
      id: notify-slack-unblocked
      version: 1
      name: "Notify Slack: Unblocked Exfiltration"
      description: >
        High-urgency Slack alert: OutputFilter did not intercept this egress
        event. Data may have left the system.
      iscommand: true
      name: "Slack.SendMessage"
      brand: "SlackV3"
    scriptarguments:
      channel:
        simple: "#ai-security-alerts"
      message:
        simple: "EXFILTRATION ALERT - OUTPUT NOT BLOCKED\nAgent: ${incident.aisecurityagentid}\nSession: ${incident.aisecuritysessionid}\nTool: ${incident.aisecuritytoolname}\nResult size: ${incident.aisecuritytoolresultsize} bytes\nOutputFilter blocked: false\nAgent API key has been revoked. Manual egress block required.\nXSOAR Incident: ${incident.id}"
    nexttasks:
      "#none#": ["8"]
  "5":
    id: "5"
    taskid: create-p1-ticket-unblocked
    type: regular
    task:
      id: create-p1-ticket-unblocked
      version: 1
      name: "Create P1 Ticket: Possible Data Escape"
      description: >
        P1 Jira ticket for confirmed or probable data exfiltration where the
        OutputFilter did not block the egress path.
      iscommand: true
      name: "Jira.createIssue"
      brand: "Jira V2"
    scriptarguments:
      summary:
        simple: "AI-002 CRITICAL: Possible Exfiltration - ${incident.aisecurityagentid} (OutputFilter bypassed)"
      description:
        simple: "Agent: ${incident.aisecurityagentid}\nSession: ${incident.aisecuritysessionid}\nTool: ${incident.aisecuritytoolname}\nTool args: ${incident.aisecuritytoolargsredacted}\nResult size: ${incident.aisecuritytoolresultsize} bytes\nOutputFilter blocked: false\nXSOAR Incident: ${incident.id}\nPlaybook: AI Agent Exfiltration Response\n\nActions taken: API key revoked. Pending: network-layer egress block, injection source investigation, breach notification assessment."
      issueType:
        simple: "Security Incident"
      priority:
        simple: "Critical"
    nexttasks:
      "#none#": ["8"]
  "6":
    id: "6"
    taskid: create-allowlist-review-ticket
    type: regular
    task:
      id: create-allowlist-review-ticket
      version: 1
      name: "Create Allowlist Review Ticket"
      description: >
        OutputFilter blocked the egress event at runtime. No data escaped.
        Opens a medium-priority ticket to review whether the destination/content
        pattern should be added to the OutputFilter allowlist or if the policy
        is correct.
      iscommand: true
      name: "Jira.createIssue"
      brand: "Jira V2"
    scriptarguments:
      summary:
        simple: "AI-002 Review: Egress Blocked by OutputFilter - ${incident.aisecurityagentid}"
      description:
        simple: "Agent: ${incident.aisecurityagentid}\nSession: ${incident.aisecuritysessionid}\nTool: ${incident.aisecuritytoolname}\nTool args: ${incident.aisecuritytoolargsredacted}\nResult size: ${incident.aisecuritytoolresultsize} bytes\nOutputFilter blocked: true\nXSOAR Incident: ${incident.id}\nPlaybook: AI Agent Exfiltration Response\n\nOutputFilter intercepted this event. Review whether destination/content should be allowlisted or policy is correctly tuned."
      issueType:
        simple: "Task"
      priority:
        simple: "Medium"
    nexttasks:
      "#none#": ["9"]
  "7":
    id: "7"
    taskid: end-not-egress
    type: end
    task:
      id: end-not-egress
      version: 1
      name: End (Not an Egress Signal)
      iscommand: false
      brand: ""
  "8":
    id: "8"
    taskid: end-escalated
    type: end
    task:
      id: end-escalated
      version: 1
      name: End (Escalated - Possible Exfiltration)
      iscommand: false
      brand: ""
  "9":
    id: "9"
    taskid: end-blocked
    type: end
    task:
      id: end-blocked
      version: 1
      name: End (Blocked by OutputFilter - Review Ticket Created)
      iscommand: false
      brand: ""
fromversion: "8.0.0"
