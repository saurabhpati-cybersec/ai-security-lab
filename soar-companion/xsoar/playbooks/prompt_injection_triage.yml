# Cortex XSOAR 8.x Playbook: AI Agent Prompt Injection Triage
# Parallel to: soar-companion/tines/stories/prompt_injection_triage.json
id: AIAgentPromptInjectionTriage
version: 1
name: AI Agent - Prompt Injection Triage
description: >
  Triages AI-001 alerts (prompt injection detector hits). Enriches with session
  context, scores severity, routes critical events to Slack, creates XSOAR incident.
starttaskid: "0"
tasks:
  "0":
    id: "0"
    taskid: start
    type: start
    task:
      id: start
      version: 1
      name: Start
      iscommand: false
      brand: ""
    nexttasks:
      "#none#": ["1"]
  "1":
    id: "1"
    taskid: check-detector-score
    type: condition
    task:
      id: check-detector-score
      version: 1
      name: "Detector score >= 0.7?"
      type: condition
      iscommand: false
      brand: ""
    conditions:
      - label: "High confidence"
        condition:
          - - operator: greaterThanOrEqual
              left:
                value:
                  simple: ${incident.aisecuritydetectorscore}
                iscontext: true
              right:
                value:
                  simple: "0.7"
    nexttasks:
      High confidence: ["2"]
      "#default#": ["9"]
  "2":
    id: "2"
    taskid: enrich-session
    type: regular
    task:
      id: enrich-session
      version: 1
      name: Enrich - Pull Session Context
      description: Calls AI Agent Log Integration to fetch full session log
      iscommand: true
      name: "AIAgentLogIntegration.getSessionLog"
      brand: "AI Agent Log Integration"
    scriptarguments:
      session_id:
        complex:
          root: incident
          accessor: aisecuritysessionid
    nexttasks:
      "#none#": ["3"]
  "3":
    id: "3"
    taskid: score-severity
    type: condition
    task:
      id: score-severity
      version: 1
      name: "Score severity from trifecta + score"
      type: condition
      iscommand: false
      brand: ""
    conditions:
      - label: "Critical"
        condition:
          - - operator: greaterThanOrEqual
              left:
                value:
                  simple: ${incident.aisecuritydetectorscore}
                iscontext: true
              right:
                value:
                  simple: "0.9"
          - - operator: isEqualTo
              left:
                value:
                  simple: ${incident.aisecuritytrifectafull}
                iscontext: true
              right:
                value:
                  simple: "true"
      - label: "High"
        condition:
          - - operator: greaterThanOrEqual
              left:
                value:
                  simple: ${incident.aisecuritydetectorscore}
                iscontext: true
              right:
                value:
                  simple: "0.7"
    nexttasks:
      Critical: ["4", "5"]
      High: ["5"]
      "#default#": ["6"]
  "4":
    id: "4"
    taskid: create-p1-ticket
    type: regular
    task:
      id: create-p1-ticket
      version: 1
      name: "Create P1 Security Incident"
      description: Creates a P1 incident in Jira for critical injection events
      iscommand: true
      name: "Jira.createIssue"
      brand: "Jira V2"
    scriptarguments:
      summary:
        simple: "AI-001 CRITICAL: Prompt Injection - ${incident.aisecurityagentid}"
      description:
        simple: "Session: ${incident.aisecuritysessionid}\nScore: ${incident.aisecuritydetectorscore}\nPlaybook: AI Agent Prompt Injection Triage"
      issueType:
        simple: "Security Incident"
      priority:
        simple: "Critical"
    nexttasks:
      "#none#": ["7"]
  "5":
    id: "5"
    taskid: slack-notify
    type: regular
    task:
      id: slack-notify
      version: 1
      name: "Notify Slack: AI Security Alert"
      iscommand: true
      name: "Slack.SendMessage"
      brand: "SlackV3"
    scriptarguments:
      channel:
        simple: "#ai-security-alerts"
      message:
        simple: "AI-001: Prompt injection detected\nAgent: ${incident.aisecurityagentid}\nSession: ${incident.aisecuritysessionid}\nScore: ${incident.aisecuritydetectorscore}"
    nexttasks:
      "#none#": ["7"]
  "6":
    id: "6"
    taskid: close-fp
    type: regular
    task:
      id: close-fp
      version: 1
      name: "Close: Low confidence, likely FP"
      description: Closes incident as false positive for low-confidence detections
      iscommand: false
      brand: ""
    nexttasks:
      "#none#": ["8"]
  "7":
    id: "7"
    taskid: end-escalated
    type: end
    task:
      id: end-escalated
      version: 1
      name: End (Escalated)
      iscommand: false
      brand: ""
  "8":
    id: "8"
    taskid: end-closed
    type: end
    task:
      id: end-closed
      version: 1
      name: End (Closed as FP)
      iscommand: false
      brand: ""
  "9":
    id: "9"
    taskid: end-below-threshold
    type: end
    task:
      id: end-below-threshold
      version: 1
      name: End (Below threshold)
      iscommand: false
      brand: ""
fromversion: "8.0.0"
